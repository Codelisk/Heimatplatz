# Docker-Compose-Setup fuer die Heimatplatz-API auf einem einzelnen Hetzner-Server.
# Aufruf vom Repo-Root: docker compose -f deploy/hetzner/docker-compose.yml up -d
# Voraussetzung: deploy/hetzner/.env (aus .env.example kopieren und echte Werte eintragen).
#
# Laeuft produktiv auf dem Hetzner-Server "heimatplatz" (128.140.33.238) unter
# /srv/heimatplatz/deploy/hetzner. Siehe README in diesem Ordner.

services:
  api:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      Database__EnableSeeding: "false"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # KI-Inseratserstellung ueber den AiConnector-Workspace projects/heimatplatz
      # (generierter Shiny.Mediator-OpenAPI-Client, Heimatplatz.Api.Core.AiConnectorClient)
      AiListing__Provider: AiConnector
      AiConnector__ApiKey: ${AICONNECTOR_API_KEY}
      # Marketing-E-Mails des Intern-Bereichs: gleicher AiConnector-Workspace,
      # Section sections/marketing/email (siehe Features/Marketing)
      Marketing__Provider: AiConnector
      # Oeffentliche Basis-URL fuer absolute Links (Bild-Proxy etc.), UNABHAENGIG vom Host der
      # eingehenden Anfrage - der Astro-SSR-Server (web) ruft diese API teils direkt ueber das
      # interne Docker-Netz auf (http://api:8080), dessen Host fuer echte Browser nicht aufloesbar
      # waere. Siehe GetPropertiesHandler.ResolveApiBaseUrl.
      Api__PublicBaseUrl: https://${API_DOMAIN}
      # E-Mail-Versand (Verifikation, Passwort-Reset) ueber die Hetzner-Webhosting-Mailbox
      # info@heimatplatz.at. Ohne EMAIL_SMTP_HOST in der .env bleibt der Versand deaktiviert
      # (Mails werden nur geloggt, siehe LoggingEmailSender + Startup-Warnung).
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      # Links in den Mails zeigen auf das Web-Frontend dieser Umgebung
      Email__FrontendBaseUrl: https://${WEB_DOMAIN}
      # Shared-Key fuer den manuellen Edikte-Sync-Trigger (X-Sync-Key-Header,
      # siehe TriggerForeclosureAuctionSyncHandler). Ohne Key ist der Endpoint gesperrt.
      ForeclosureAuctions__Scraping__SyncTriggerKey: ${SYNC_TRIGGER_KEY:-}
      # Firmenpool-API (eigene Firmendatenbank auf dem aiconnector-Server; dessen Caddy
      # laesst die Server-IP nur fuer lesende Firmendaten-Routen durch). Der Lead-Pool
      # fragt live dort an - Heimatplatz speichert selbst keine Firmenbuch-Daten mehr.
      Firmenbuch__Firmenpool__BaseUrl: https://static.91.18.104.178.clients.your-server.de
      # Shared-Key fuer die /api/admin-Endpoints des Intern-Bereichs (X-Admin-Key-Header,
      # siehe AdminAccessGuard). Ohne Key sind die Endpoints gesperrt (fail-closed).
      Admin__ApiKey: ${ADMIN_API_KEY:-}
      # Web Push (VAPID) fuer Browser-Benachrichtigungen. Schluesselpaar einmalig erzeugen
      # (base64url, web-push-Format) und in der .env ablegen; ohne Keys bleibt der
      # WebPush-Transport deaktiviert.
      PushNotifications__WebPush__PublicKey: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      PushNotifications__WebPush__PrivateKey: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      PushNotifications__WebPush__Subject: ${WEBPUSH_VAPID_SUBJECT:-mailto:info@heimatplatz.at}
      # APNs (iOS): .p8-Key liegt als Secret auf dem Server (nicht im Repo)
      PushNotifications__Apns__TeamId: ${APNS_TEAM_ID}
      PushNotifications__Apns__KeyId: ${APNS_KEY_ID}
      PushNotifications__Apns__BundleId: ${APNS_BUNDLE_ID:-at.heimatplatz.app}
      PushNotifications__Apns__PrivateKeyPath: /run/secrets/apns-auth-key.p8
      # FCM (Android): Firebase-Service-Account (Projekt heimatplatz-b77ca) als Secret
      PushNotifications__Firebase__ServiceAccountPath: /run/secrets/firebase-service-account.json
      # Google Search Console (Intern-Bereich /intern/analytics): Service-Account-Key als
      # Secret, kein OAuth-Consent-Flow noetig. Nur auf Prod (api) - gilt nur fuer die
      # echte Domain, nicht fuer api-test. Ohne Key bleibt das Feature fail-soft deaktiviert.
      SearchConsole__ServiceAccountPath: /run/secrets/search-console-service-account.json
      SearchConsole__SiteUrl: ${SEARCH_CONSOLE_SITE_URL:-sc-domain:heimatplatz.at}
      # Adress-Geocoding fuer die Kartenansicht (Nominatim, im Service auf
      # 1 Request/Sekunde gedrosselt). Opt-in: ohne Flag keine externen Requests.
      Geocoding__Enabled: "true"
      # OpenImmo-Import (Justimmo-FTP-Feeds, z.B. Immobaer): der ftp-Container
      # schreibt in openimmo_data, die API scannt die Drop-Ordner periodisch.
      # State (Marker/Arbeitskopien) liegt BEWUSST ausserhalb der FTP-Chroots.
      # Feed-Definition (Key/SourceName/SellerName/Bild-Allowlist) steht in
      # appsettings.json - hier nur Pfade, Intervall und der Trigger-Key.
      OpenImmoImport__IncomingRootPath: /data/openimmo/incoming
      OpenImmoImport__StateRootPath: /data/openimmo/state
      OpenImmoImport__ScanIntervalMinutes: "15"
      OpenImmoImport__SyncTriggerKey: ${SYNC_TRIGGER_KEY:-}
    volumes:
      # Extrahierte Gutachten-Fotos und normale Property-Uploads muessen
      # Container-Rebuilds ueberleben.
      - api_uploads:/app/wwwroot/uploads
      # OpenImmo-FTP-Drop-Ordner (geteilt mit dem ftp-Service)
      - openimmo_data:/data/openimmo
      - ./secrets/apns-auth-key.p8:/run/secrets/apns-auth-key.p8:ro
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./secrets/search-console-service-account.json:/run/secrets/search-console-service-account.json:ro
    # Kein Host-Port-Mapping - nur ueber das interne Docker-Netzwerk via Caddy erreichbar.
    expose:
      - "8080"

  # Test-API: gleicher Code/Build wie Prod, haengt aber an der Testdatenbank
  # (docker-compose.testdb.yml, Port 5433 auf demselben Host). Seeding aktiv,
  # damit die Test-DB nach einem Reset beim naechsten Start automatisch neu
  # migriert und geseedet wird. Eigener JWT-Key: Test-Tokens gelten nicht auf Prod.
  api-test:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      Database__EnableSeeding: "true"
      ConnectionStrings__DefaultConnection: "Host=128.140.33.238;Port=5433;Database=heimatplatz_test;Username=heimatplatz_test;Password=${TESTDB_PASSWORD}"
      Authentication__Jwt__Key: ${TEST_JWT_KEY}
      AiListing__Provider: AiConnector
      AiConnector__ApiKey: ${AICONNECTOR_API_KEY}
      Marketing__Provider: AiConnector
      Api__PublicBaseUrl: https://${TEST_API_DOMAIN}
      # Gleiche Mailbox wie Prod, aber Mail-Links zeigen auf das Test-Web
      Email__SmtpHost: ${EMAIL_SMTP_HOST}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__FrontendBaseUrl: https://${WEB_TEST_DOMAIN}
      ForeclosureAuctions__Scraping__SyncTriggerKey: ${SYNC_TRIGGER_KEY:-}
      Firmenbuch__Firmenpool__BaseUrl: https://static.91.18.104.178.clients.your-server.de
      Admin__ApiKey: ${ADMIN_API_KEY:-}
      Geocoding__Enabled: "true"
      PushNotifications__Apns__TeamId: ${APNS_TEAM_ID}
      PushNotifications__Apns__KeyId: ${APNS_KEY_ID}
      PushNotifications__Apns__BundleId: ${APNS_BUNDLE_ID:-at.heimatplatz.app}
      PushNotifications__Apns__PrivateKeyPath: /run/secrets/apns-auth-key.p8
      # FCM (Android): gleicher Firebase-Service-Account wie Prod
      PushNotifications__Firebase__ServiceAccountPath: /run/secrets/firebase-service-account.json
      # Web Push (VAPID): gleiches Schluesselpaar wie Prod, siehe Kommentar beim api-Service
      PushNotifications__WebPush__PublicKey: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
      PushNotifications__WebPush__PrivateKey: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
      PushNotifications__WebPush__Subject: ${WEBPUSH_VAPID_SUBJECT:-mailto:info@heimatplatz.at}
    volumes:
      - ./secrets/apns-auth-key.p8:/run/secrets/apns-auth-key.p8:ro
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - api_test_uploads:/app/wwwroot/uploads
    expose:
      - "8080"

  # Astro-Web als SSR-Node-Server (seit 15.7.2026, vorher statisches file_server-Hosting).
  # Das Build-Artefakt (dist/: server/entry.mjs + client/) kommt per rsync aus
  # deploy-apps.yml nach /srv/heimatplatz-web; nach jedem Deploy wird dieser
  # Container neu gestartet. Kein eigenes Image noetig - Standalone-Bundle des
  # @astrojs/node-Adapters enthaelt alle Abhaengigkeiten.
  web:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - api
    command: ["node", "/srv/web/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # SSR-Fetches gehen direkt ans interne Docker-Netz statt ueber die oeffentliche Domain
      API_BASE_URL_SERVER: http://api:8080
      # Shared-Key fuer den Edikte-Sync-Trigger (/intern/sync.ts -> X-Sync-Key)
      SYNC_TRIGGER_KEY: ${SYNC_TRIGGER_KEY:-}
      # Shared-Key fuer die Intern-Verwaltung (/intern/* -> X-Admin-Key, lib/server/admin-api.ts)
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - /srv/heimatplatz-web:/srv/web:ro
    expose:
      - "8080"

  # Test-Web: gleiche Astro-SSR-Laufzeit wie "web", haengt aber an der Test-API
  # (api-test) statt der Prod-API. Das Bundle wird separat mit
  # PUBLIC_API_BASE_URL=https://${TEST_API_DOMAIN} gebaut (Client-Skripte) und liegt
  # unter /srv/heimatplatz-web-test; SSR-Fetches gehen zur Laufzeit ans interne
  # Docker-Netz (http://api-test:8080). Deploy via Cake-Target DeployAstroTest.
  web-test:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - api-test
    command: ["node", "/srv/web/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_BASE_URL_SERVER: http://api-test:8080
      SYNC_TRIGGER_KEY: ${SYNC_TRIGGER_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - /srv/heimatplatz-web-test:/srv/web:ro
    expose:
      - "8080"

  # FTP-Server fuer OpenImmo-Feeds (Justimmo pusht mehrmals taeglich den kompletten
  # Objektbestand eines Maklers als OpenImmo-XML/ZIP). Ein USERS-Eintrag je Feed,
  # chrooted ins jeweilige Home = Drop-Ordner unter /data/openimmo/incoming/{feed}.
  # Passive Mode: ADDRESS muss die oeffentliche Server-IP sein, der Port-Range ist
  # in UFW freigeschaltet (siehe README). Kein TLS (delfer/vsftpd kann keines) -
  # falls Justimmo FTPS verlangt, auf stilliard/pure-ftpd wechseln.
  ftp:
    image: delfer/alpine-ftp-server
    restart: unless-stopped
    environment:
      USERS: "immobaer|${OPENIMMO_FTP_PASSWORD_IMMOBAER:-disabled}|/data/openimmo/incoming/immobaer|1000"
      ADDRESS: "128.140.33.238"
      MIN_PORT: "21000"
      MAX_PORT: "21010"
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - openimmo_data:/data/openimmo

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - api-test
      - web
      - web-test
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      TEST_API_DOMAIN: ${TEST_API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      WEB_TEST_DOMAIN: ${WEB_TEST_DOMAIN}
      # Erlaubte IP(s) fuer /intern (Web) und /api/foreclosure-auctions/sync (API).
      # Leerzeichen-getrennt, IPs oder CIDR-Ranges, siehe .env.example.
      HOME_IP: ${HOME_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Karten-Tiles der Faltkarte (PMTiles + Fonts/Sprites), einmalig per
      # "npm run map-tiles -- --out deploy/hetzner/map-tiles" erzeugt und
      # hochgeladen; Caddy served sie unter /tiles/* (Range-Requests).
      - ./map-tiles:/srv/map-tiles:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  api_uploads:
  api_test_uploads:
  caddy_data:
  caddy_config:
  # OpenImmo-FTP-Feeds: incoming/{feed} (FTP-Homes) + state/{feed} (API-Marker)
  openimmo_data:
