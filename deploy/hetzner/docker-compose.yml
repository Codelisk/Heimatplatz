# Docker-Compose-Setup fuer die Heimatplatz-API auf einem einzelnen Hetzner-Server.
# Aufruf vom Repo-Root: docker compose -f deploy/hetzner/docker-compose.yml up -d
# Voraussetzung: deploy/hetzner/.env (aus .env.example kopieren und echte Werte eintragen).
#
# Laeuft produktiv auf dem Hetzner-Server "heimatplatz" (128.140.33.238) unter
# /srv/heimatplatz/deploy/hetzner. Siehe README in diesem Ordner.

services:
  api:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      Database__EnableSeeding: "false"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # KI-Inseratserstellung ueber den AiConnector-Workspace projects/heimatplatz
      # (generierter Shiny.Mediator-OpenAPI-Client, Heimatplatz.Api.Core.AiConnectorClient)
      AiListing__Provider: AiConnector
      AiConnector__ApiKey: ${AICONNECTOR_API_KEY}
      # Oeffentliche Basis-URL fuer absolute Links (Bild-Proxy etc.), UNABHAENGIG vom Host der
      # eingehenden Anfrage - der Astro-SSR-Server (web) ruft diese API teils direkt ueber das
      # interne Docker-Netz auf (http://api:8080), dessen Host fuer echte Browser nicht aufloesbar
      # waere. Siehe GetPropertiesHandler.ResolveApiBaseUrl.
      Api__PublicBaseUrl: https://${API_DOMAIN}
    # Kein Host-Port-Mapping - nur ueber das interne Docker-Netzwerk via Caddy erreichbar.
    expose:
      - "8080"

  # Test-API: gleicher Code/Build wie Prod, haengt aber an der Testdatenbank
  # (docker-compose.testdb.yml, Port 5433 auf demselben Host). Seeding aktiv,
  # damit die Test-DB nach einem Reset beim naechsten Start automatisch neu
  # migriert und geseedet wird. Eigener JWT-Key: Test-Tokens gelten nicht auf Prod.
  api-test:
    build:
      context: ../..
      dockerfile: src/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      Database__EnableSeeding: "true"
      ConnectionStrings__DefaultConnection: "Host=128.140.33.238;Port=5433;Database=heimatplatz_test;Username=heimatplatz_test;Password=${TESTDB_PASSWORD}"
      Authentication__Jwt__Key: ${TEST_JWT_KEY}
      AiListing__Provider: AiConnector
      AiConnector__ApiKey: ${AICONNECTOR_API_KEY}
      Api__PublicBaseUrl: https://${TEST_API_DOMAIN}
      PushNotifications__Apns__TeamId: ${APNS_TEAM_ID}
      PushNotifications__Apns__KeyId: ${APNS_KEY_ID}
      PushNotifications__Apns__BundleId: ${APNS_BUNDLE_ID:-at.heimatplatz.app}
      PushNotifications__Apns__PrivateKeyPath: /run/secrets/apns-auth-key.p8
    volumes:
      - ./secrets/apns-auth-key.p8:/run/secrets/apns-auth-key.p8:ro
    expose:
      - "8080"

  # Astro-Web als SSR-Node-Server (seit 15.7.2026, vorher statisches file_server-Hosting).
  # Das Build-Artefakt (dist/: server/entry.mjs + client/) kommt per rsync aus
  # deploy-apps.yml nach /srv/heimatplatz-web; nach jedem Deploy wird dieser
  # Container neu gestartet. Kein eigenes Image noetig - Standalone-Bundle des
  # @astrojs/node-Adapters enthaelt alle Abhaengigkeiten.
  web:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      - api
    command: ["node", "/srv/web/server/entry.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # SSR-Fetches gehen direkt ans interne Docker-Netz statt ueber die oeffentliche Domain
      API_BASE_URL_SERVER: http://api:8080
    volumes:
      - /srv/heimatplatz-web:/srv/web:ro
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - api-test
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      TEST_API_DOMAIN: ${TEST_API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      # Erlaubte IP(s) fuer /intern (Web) und /api/foreclosure-auctions/sync (API).
      # Leerzeichen-getrennt, IPs oder CIDR-Ranges, siehe .env.example.
      HOME_IP: ${HOME_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
