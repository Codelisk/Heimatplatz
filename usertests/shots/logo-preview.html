<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Landhaus-Logo Vorschau</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .row { display: flex; align-items: flex-end; gap: 28px; padding: 28px 32px; }
  .light { background: oklch(0.945 0.028 83); }
  .dark { background: oklch(0.18 0.012 55); color: #eee; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #888; }
  img { display: block; }
</style>
</head>
<body>
  <div class="row light">
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="300" height="300">NEU 300</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="96" height="96">NEU 96</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="48" height="48">48</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="32" height="32">32</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="16" height="16">16</div>
    <div class="cell"><img src="../../src/web/public/logo-mark.svg" width="150" height="150">ALT (Original) 150</div>
    <div class="cell"><img src="../../src/web/public/logo-mark.svg" width="32" height="32">alt 32</div>
  </div>
  <div class="row dark">
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="300" height="300">NEU 300</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="96" height="96">NEU 96</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="48" height="48">48</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="32" height="32">32</div>
    <div class="cell"><img src="../../src/web/public/logo-landhaus.svg" width="16" height="16">16</div>
    <div class="cell"><img src="../../src/web/public/logo-mark.svg" width="150" height="150">ALT (Original) 150</div>
    <div class="cell"><img src="../../src/web/public/logo-mark.svg" width="32" height="32">alt 32</div>
  </div>
</body>
</html>
