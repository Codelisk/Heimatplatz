workflows:
  ios-testflight:
    name: iOS - TestFlight Deploy
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        DOTNET_ROOT: $CM_BUILD_DIR/dotnet
      groups:
        # Encrypted variable group "ios_deploy" - see setup instructions.
        # Required vars: ASC_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID,
        #                 APPLE_TEAM_ID, MATCH_GIT_URL, MATCH_PASSWORD
        - ios_deploy
    scripts:
      - name: Install .NET 10 SDK
        script: |
          wget -q https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality ga --install-dir "$DOTNET_ROOT"
          echo "PATH=$DOTNET_ROOT:$PATH" >> $CM_ENV

      - name: Install MAUI iOS workload
        script: |
          dotnet workload install ios maui

      - name: Decode store keys
        script: |
          echo "$ASC_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/AuthKey.p8"
          # Play-Key nur fuer den VersionBump-Baseline-Check: ohne ihn sieht der
          # iOS-Lauf nur TestFlight und die Versionen driften von Android weg
          # (z.B. iOS 1.72 waehrend Android 1.73 released).
          if [ -n "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/play-store-key.json"
          fi

      # Kein Kanal-Parameter noetig: Der Build geht als TestFlight-Version raus und
      # wird spaeter unveraendert zur App-Store-Version befoerdert. Die App erkennt
      # TestFlight zur Laufzeit am sandboxReceipt und schaltet nur dort die
      # Entwicklerwerkzeuge frei (docs/app-channels.md).
      - name: Run Cake DeployIos (build + TestFlight upload)
        script: |
          cd "$CM_BUILD_DIR/cake"
          export ASC_KEY_PATH="AuthKey.p8"
          if [ -f "$CM_BUILD_DIR/cake/play-store-key.json" ]; then
            export PLAY_STORE_JSON_KEY_PATH="play-store-key.json"
          fi
          dotnet run -- --target=DeployIos

      - name: Cleanup store keys
        script: |
          rm -f "$CM_BUILD_DIR/cake/AuthKey.p8" "$CM_BUILD_DIR/cake/play-store-key.json"

    artifacts:
      - artifacts/ios/**/*.ipa

    publishing:
      email:
        recipients:
          - info@vorleistung.at
        notify:
          success: true
          failure: true

  ios-screenshots:
    name: iOS - App Store Screenshots
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        DOTNET_ROOT: $CM_BUILD_DIR/dotnet
        # Auf "true" setzen (oder per Build-Trigger ueberschreiben), um die Screenshots
        # direkt nach der Aufnahme via deliver in App Store Connect hochzuladen.
        UPLOAD_SCREENSHOTS: "false"
      groups:
        # ios_deploy: nur fuer den optionalen Upload noetig (ASC-API-Key)
        # screenshots: TESTDB_PASSWORD fuer die lokale Test-API gegen die Hetzner-Test-Postgres
        - ios_deploy
        - screenshots
    scripts:
      - name: Install .NET 10 SDK
        script: |
          wget -q https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality ga --install-dir "$DOTNET_ROOT"
          echo "PATH=$DOTNET_ROOT:$PATH" >> $CM_ENV

      - name: Install MAUI iOS workload
        script: |
          dotnet workload install ios maui

      - name: Run Cake IosScreenshots (simulator capture)
        script: |
          cd "$CM_BUILD_DIR/cake"
          dotnet run -- --target=IosScreenshots

      - name: Upload screenshots to App Store Connect (optional)
        script: |
          set -e
          if [ "$UPLOAD_SCREENSHOTS" != "true" ]; then
            echo "UPLOAD_SCREENSHOTS != true - skipping upload."
            exit 0
          fi
          echo "$ASC_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/AuthKey.p8"
          cd "$CM_BUILD_DIR/cake"
          export ASC_KEY_PATH="AuthKey.p8"
          dotnet run -- --target=UploadIosScreenshots
          rm -f "$CM_BUILD_DIR/cake/AuthKey.p8"

    artifacts:
      - artifacts/screenshots/**/*.png

    publishing:
      email:
        recipients:
          - info@vorleistung.at
        notify:
          success: true
          failure: true
