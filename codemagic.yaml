workflows:
  ios-testflight:
    name: iOS - TestFlight Deploy
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        DOTNET_ROOT: $CM_BUILD_DIR/dotnet
      groups:
        # Encrypted variable group "ios_deploy" - see setup instructions.
        # Required vars: ASC_KEY_BASE64, ASC_KEY_ID, ASC_ISSUER_ID,
        #                 APPLE_TEAM_ID, MATCH_GIT_URL, MATCH_PASSWORD
        - ios_deploy
    scripts:
      - name: Install .NET 10 SDK
        script: |
          wget -q https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality ga --install-dir "$DOTNET_ROOT"
          echo "PATH=$DOTNET_ROOT:$PATH" >> $CM_ENV

      - name: Install MAUI iOS workload
        script: |
          dotnet workload install ios maui

      - name: Decode store keys
        script: |
          echo "$ASC_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/AuthKey.p8"
          # Play-Key nur fuer den VersionBump-Baseline-Check: ohne ihn sieht der
          # iOS-Lauf nur TestFlight und die Versionen driften von Android weg
          # (z.B. iOS 1.72 waehrend Android 1.73 released).
          if [ -n "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/play-store-key.json"
          fi

      # Kein Kanal-Parameter noetig: Der Build geht als TestFlight-Version raus und
      # wird spaeter unveraendert zur App-Store-Version befoerdert. Die App erkennt
      # TestFlight zur Laufzeit am sandboxReceipt und schaltet nur dort die
      # Entwicklerwerkzeuge frei (docs/app-channels.md).
      - name: Run Cake DeployIos (build + TestFlight upload)
        script: |
          cd "$CM_BUILD_DIR/cake"
          export ASC_KEY_PATH="AuthKey.p8"
          if [ -f "$CM_BUILD_DIR/cake/play-store-key.json" ]; then
            export PLAY_STORE_JSON_KEY_PATH="play-store-key.json"
          fi
          dotnet run -- --target=DeployIos

      - name: Cleanup store keys
        script: |
          rm -f "$CM_BUILD_DIR/cake/AuthKey.p8" "$CM_BUILD_DIR/cake/play-store-key.json"

    artifacts:
      - artifacts/ios/**/*.ipa

    publishing:
      email:
        recipients:
          - info@vorleistung.at
        notify:
          success: true
          failure: true

  # Baut libmln-cabi.xcframework (Device+Simulator) aus maplibre-native @ dem
  # v4.5.0-Pin plus unserem gevendorten C-ABI-Wrapper (native-src/, enthaelt den
  # pixelRatio-Fix, Vendor-README Abweichung 4). Repliziert Upstreams
  # native-apple.yml-Rezept. Das Artefakt wird heruntergeladen und ersetzt
  # native/ios/libmln-cabi.xcframework im Repo - danach kann compatPixelRatio
  # fuer iOS auf 1.0 (Abweichung 6).
  ios-native-maplibre:
    name: iOS - MapLibre C-ABI Eigenbau (xcframework)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
    scripts:
      - name: Clone maplibre-native @ v4.5.0-Pin
        script: |
          set -e
          MLN_PIN=08579ca76d35785605257921619f08d33dac4ac0
          mkdir -p "$CM_BUILD_DIR/mln-build/dependencies"
          git clone --filter=blob:none https://github.com/maplibre/maplibre-native.git \
            "$CM_BUILD_DIR/mln-build/dependencies/maplibre-native"
          cd "$CM_BUILD_DIR/mln-build/dependencies/maplibre-native"
          git checkout "$MLN_PIN"
          git -c submodule.fetchJobs=8 submodule update --init --recursive

      - name: Build-Baum zusammensetzen (Wrapper mit pixelRatio-Fix)
        script: |
          set -e
          cd "$CM_BUILD_DIR/mln-build"
          cp -R "$CM_BUILD_DIR/src/maui/src/ThirdParty/MapLibreNative.Maui/native-src" native
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15 FATAL_ERROR)
          project(maplibre-maui LANGUAGES CXX C OBJC OBJCXX)
          set(MAPLIBRE_NATIVE_DIR "${CMAKE_CURRENT_LIST_DIR}/dependencies/maplibre-native"
              CACHE PATH "Path to maplibre-native source tree")
          add_subdirectory("${MAPLIBRE_NATIVE_DIR}" "${CMAKE_BINARY_DIR}/maplibre-native")
          add_subdirectory(native)
          EOF

      - name: iOS-Device-Slice (arm64) bauen
        script: |
          set -e
          cd "$CM_BUILD_DIR/mln-build"
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMLN_WITH_METAL=ON
          cmake --build build-ios --target mln-cabi --config Release
          mkdir -p out/ios-arm64
          ALL_LIBS=$(find build-ios -name "*.a" -type f | sort)
          libtool -static -o out/ios-arm64/libmln-cabi.a $ALL_LIBS
          strip -S out/ios-arm64/libmln-cabi.a
          ls -lh out/ios-arm64/libmln-cabi.a

      - name: iOS-Simulator-Slice (arm64) bauen
        script: |
          set -e
          cd "$CM_BUILD_DIR/mln-build"
          cmake -B build-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DMLN_WITH_METAL=ON
          cmake --build build-sim --target mln-cabi --config Release
          mkdir -p out/ios-arm64-simulator
          ALL_LIBS=$(find build-sim -name "*.a" -type f | sort)
          libtool -static -o out/ios-arm64-simulator/libmln-cabi.a $ALL_LIBS
          strip -S out/ios-arm64-simulator/libmln-cabi.a
          ls -lh out/ios-arm64-simulator/libmln-cabi.a

      - name: XCFramework bauen und packen
        script: |
          set -e
          cd "$CM_BUILD_DIR/mln-build"
          xcodebuild -create-xcframework \
            -library out/ios-arm64/libmln-cabi.a \
            -library out/ios-arm64-simulator/libmln-cabi.a \
            -output out/libmln-cabi.xcframework
          cd out
          zip -r libmln-cabi.xcframework.zip libmln-cabi.xcframework
          ls -lh libmln-cabi.xcframework.zip

    artifacts:
      - mln-build/out/libmln-cabi.xcframework.zip

    publishing:
      email:
        recipients:
          - info@vorleistung.at
        notify:
          success: true
          failure: true

  ios-screenshots:
    name: iOS - App Store Screenshots
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        DOTNET_ROOT: $CM_BUILD_DIR/dotnet
        # Auf "true" setzen (oder per Build-Trigger ueberschreiben), um die Screenshots
        # direkt nach der Aufnahme via deliver in App Store Connect hochzuladen.
        UPLOAD_SCREENSHOTS: "false"
      groups:
        # ios_deploy: nur fuer den optionalen Upload noetig (ASC-API-Key)
        # screenshots: TESTDB_PASSWORD fuer die lokale Test-API gegen die Hetzner-Test-Postgres
        - ios_deploy
        - screenshots
    scripts:
      - name: Install .NET 10 SDK
        script: |
          wget -q https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality ga --install-dir "$DOTNET_ROOT"
          echo "PATH=$DOTNET_ROOT:$PATH" >> $CM_ENV

      - name: Install MAUI iOS workload
        script: |
          dotnet workload install ios maui

      - name: Run Cake IosScreenshots (simulator capture)
        script: |
          cd "$CM_BUILD_DIR/cake"
          dotnet run -- --target=IosScreenshots

      - name: Upload screenshots to App Store Connect (optional)
        script: |
          set -e
          if [ "$UPLOAD_SCREENSHOTS" != "true" ]; then
            echo "UPLOAD_SCREENSHOTS != true - skipping upload."
            exit 0
          fi
          echo "$ASC_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cake/AuthKey.p8"
          cd "$CM_BUILD_DIR/cake"
          export ASC_KEY_PATH="AuthKey.p8"
          dotnet run -- --target=UploadIosScreenshots
          rm -f "$CM_BUILD_DIR/cake/AuthKey.p8"

    artifacts:
      - artifacts/screenshots/**/*.png

    publishing:
      email:
        recipients:
          - info@vorleistung.at
        notify:
          success: true
          failure: true
