<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!--
  Quell-HTML fuer die Play-Store-Feature-Grafik (1024x500).
  Design: Anschlagtafel-Look - Creme-Flaeche mit roten Balken, rundes Alpenhaus-Badge (logo-mark.svg).
  Screenshot des Body ergibt die fertige Grafik (aktuell: cake/fastlane/metadata/android/de-DE/images/featureGraphic.png).
  Schrift: Schibsted Grotesk (Web-Brand-Font); muss lokal installiert sein, sonst Fallback.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    background: #f9f5f1;
    display: flex;
    align-items: center;
    font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
  }
  .bar {
    position: absolute;
    left: 0;
    width: 1024px;
    height: 30px;
    background: #de2a2f;
  }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; }
  .content {
    display: flex;
    align-items: center;
    gap: 60px;
    padding-left: 75px;
  }
  .badge {
    width: 295px;
    height: 295px;
    flex-shrink: 0;
  }
  .text h1 {
    font-size: 62px;
    font-weight: 700;
    letter-spacing: 14px;
    color: #1a1a1a;
    margin-bottom: 22px;
  }
  .text p {
    font-size: 25px;
    font-weight: 400;
    line-height: 1.45;
    color: #2b2b2b;
  }
</style>
</head>
<body>
  <div class="bar top"></div>
  <div class="bar bottom"></div>
  <div class="content">
    <img class="badge" src="../src/web/public/logo-mark.svg" />
    <div class="text">
      <h1>HEIMATPLATZ</h1>
      <p>H&auml;user, Grundst&uuml;cke und<br>Zwangsversteigerungen in Ober&ouml;sterreich</p>
    </div>
  </div>
</body>
</html>
