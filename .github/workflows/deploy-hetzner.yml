name: Deploy API (Hetzner)

# INAKTIV - der API-Deploy laeuft MANUELL, nicht ueber diesen Workflow (Stand 16.7.2026).
#
# Der Server existiert laengst (siehe deploy/hetzner/README.md) und HETZNER_HOST/HETZNER_USER/
# HETZNER_SSH_KEY sind gesetzt. Was fehlt, ist die Repo-Variable HETZNER_DEPLOY_ENABLED - ohne
# sie wird der deploy-Job unten uebersprungen. Dieser Workflow ist noch nie gelaufen.
#
# ACHTUNG, vor dem Aktivieren zu klaeren: der deploy-Job passt NICHT zum tatsaechlichen Stack.
# In deploy/hetzner/docker-compose.yml ist "api" ein build:-Service (Kontext = Repo-Root, wird
# auf dem Server gebaut) und referenziert KEIN Registry-Image. "docker compose pull api" kann
# das hier gebaute GHCR-Image also gar nicht ziehen. Zum Aktivieren muesste der api-Service auf
# "image: ghcr.io/..." umgestellt werden - eine bewusste Entscheidung, kein Ein-Zeilen-Fix.
#
# Der real genutzte Weg (siehe README + Memory): kompletten src/api-Baum vom Entwicklerrechner
# auf den Server kopieren (lokal ist kein rsync verfuegbar, git archive/tar ueber SSH tut es),
# dann auf dem Server "docker compose up -d --build api". Kein Git-Checkout am Server.
#
# Der build-and-push-Job unten funktioniert unabhaengig davon und legt das Image in der GHCR ab.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/heimatplatz-api

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Kontext = Repo-Root (nicht src/api/) - siehe Kommentar in src/api/Dockerfile
          context: .
          file: src/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Hetzner
    needs: build-and-push
    runs-on: ubuntu-latest
    # Die Secrets existieren bereits - dieser Job haengt allein an der Repo-Variable, die bewusst
    # nicht gesetzt ist. Siehe Kopf der Datei: der Job ist ungetestet und der pull-Schritt passt
    # nicht zum build:-Service in der Compose-Datei. Nicht ohne die dort genannte Umstellung
    # aktivieren.
    if: ${{ vars.HETZNER_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Stack liegt unter /srv, nicht /opt (frueher hier falsch hinterlegt).
            cd /srv/heimatplatz/deploy/hetzner
            docker compose pull api
            # Nur die API neu starten - ein nacktes "up -d" wuerde den ganzen Stack
            # (postgres, caddy, web, api-test) mit anfassen.
            docker compose up -d api
