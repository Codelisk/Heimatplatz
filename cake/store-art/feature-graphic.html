<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Play-Store-Feature-Grafik 1024x500 im OG-Bild-Design (src/web/public/og/):
     Manila-Grund, rote Balken, Logo-Badge + Wordmark in echter Schibsted Grotesk.
     Wird von GenerateStoreArt per Headless-Chrome gerendert. -->
<style>
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("../../src/maui/src/Heimatplatz.Maui/Resources/Fonts/SchibstedGrotesk-Bold.ttf") format("truetype");
    font-weight: 800;
  }
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("../../src/maui/src/Heimatplatz.Maui/Resources/Fonts/SchibstedGrotesk-Medium.ttf") format("truetype");
    font-weight: 500;
  }
  * { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  .canvas {
    position: relative;
    width: 1024px;
    height: 500px;
    background: #f9f5f1;
    font-family: "Schibsted Grotesk", sans-serif;
  }
  .bar { position: absolute; left: 0; width: 1024px; height: 30px; background: #de2a2f; }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; }
  .badge { position: absolute; left: 78px; top: 100px; width: 300px; height: 300px; }
  .text { position: absolute; left: 424px; top: 0; height: 500px; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 7px;
    color: #1e1615;
    margin-bottom: 18px;
  }
  p {
    font-size: 23px;
    font-weight: 500;
    color: #5b504e;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bar top"></div>
    <div class="bar bottom"></div>
    <img class="badge" src="../../src/web/public/logo-mark.svg" alt="">
    <div class="text">
      <h1>HEIMATPLATZ</h1>
      <p>Häuser, Grundstücke und<br>Zwangsversteigerungen in Oberösterreich</p>
    </div>
  </div>
</body>
</html>
