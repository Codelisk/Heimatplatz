<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- PWA-Maskable-Icon: Markenrot full-bleed + Badge bei 75% - bleibt damit sicher in
     der Maskable-Safe-Zone (zentrale 80%-Kreisflaeche), egal welche Maske der
     Launcher anlegt. Viewport-relativ fuer 192 und 512. -->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  .canvas {
    width: 100vw;
    height: 100vh;
    background: #9f1519;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img { width: 75vw; height: 75vh; }
</style>
</head>
<body>
  <div class="canvas">
    <img src="../../src/web/public/logo-mark.svg" alt="">
  </div>
</body>
</html>
