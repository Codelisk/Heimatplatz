<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- iOS-18-App-Icon (Dark): Badge bei 75% auf TRANSPARENTEM Grund - Apple legt bei
     Dark Icons selbst den dunklen Verlauf dahinter (HIG: "omit the background").
     Screenshot braucht - -default-background-color=00000000. -->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .canvas {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img { width: 75vw; height: 75vh; }
</style>
</head>
<body>
  <div class="canvas">
    <img src="../../src/web/public/logo-mark.svg" alt="">
  </div>
</body>
</html>
